name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
        env:
          OFFLINE: '1'
      - run: npm run smoke
        env:
          SMOKE_OUTPUT: ${{ runner.temp }}/dealradar-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-smoke
          path: ${{ runner.temp }}/dealradar-smoke
